# ═══════════════════════════════════════════════════════════════
#  Mine composition and reset behaviour
#
#  Reset strategy note: percentage-triggered resets beat timed ones.
#  A timer resets a half-full mine (wasting blocks) or leaves an empty
#  one (players stand idle). Resetting at 25% remaining keeps the mine
#  continuously useful.
#
#  Composition shifts from cheap-and-dense to valuable-and-sparse as
#  ranks climb, which is what makes higher ranks feel like progress
#  without multiplying raw block income.
# ═══════════════════════════════════════════════════════════════

reset:
  # Reset when this fraction of blocks remains.
  trigger-percent-remaining: 25

  # Hard ceiling so an unused mine still refreshes.
  max-interval-seconds: 900

  # Resetting in slices avoids a single-tick stall on large mines.
  # A 100x100x30 mine is 300k blocks; placing those in one tick is a
  # guaranteed timeout.
  async-block-placement: true
  blocks-per-tick: 8000

  warn-seconds-before: 10
  teleport-players-out: true

mines:
  mine-a:
    rank: A
    size: { x: 40, y: 20, z: 40 }
    composition:
      STONE: 70
      COAL_ORE: 25
      IRON_ORE: 5

  mine-f:
    rank: F
    size: { x: 60, y: 25, z: 60 }
    composition:
      STONE: 40
      IRON_ORE: 30
      GOLD_ORE: 20
      REDSTONE_ORE: 10

  mine-m:
    rank: M
    size: { x: 80, y: 30, z: 80 }
    composition:
      IRON_ORE: 25
      GOLD_ORE: 25
      DIAMOND_ORE: 20
      LAPIS_ORE: 20
      EMERALD_ORE: 10

  mine-t:
    rank: T
    size: { x: 100, y: 30, z: 100 }
    composition:
      DIAMOND_ORE: 35
      EMERALD_ORE: 30
      ANCIENT_DEBRIS: 5
      GOLD_BLOCK: 20
      DIAMOND_BLOCK: 10

  mine-z:
    rank: Z
    size: { x: 120, y: 35, z: 120 }
    composition:
      DIAMOND_BLOCK: 30
      EMERALD_BLOCK: 30
      NETHERITE_BLOCK: 10
      ANCIENT_DEBRIS: 15
      GOLD_BLOCK: 15
